<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 130 320 250" fill="none">
  <!-- Right tall mountain left facet (light silver-slate) -->
  <polygon points="321,142 244.5,270 321,353" fill="#B8C2CC" />
  <!-- Right tall mountain right facet (deep navy) -->
  <polygon points="321,142 451,353 321,353" fill="#162647" />
  <!-- Left mountain left facet (medium slate) -->
  <polygon points="244.5,225 168,353 244.5,353" fill="#6F7C8C" />
  <!-- Left mountain right facet (dark slate) -->
  <polygon points="244.5,225 321,353 244.5,353" fill="#3A4A63" />
  <!-- Golden mineral vein -->
  <polyline
    points="331,179 366,236 344,269 381,325"
    stroke="#CBA230"
    stroke-width="11"
    stroke-linecap="butt"
    stroke-linejoin="miter"
    fill="none"
  />
  <!-- Golden crystal diamond (4 facets) -->
  <polygon points="386,309 366,331 386,331" fill="#E6C655" />
  <polygon points="386,309 406,331 386,331" fill="#C59B27" />
  <polygon points="366,331 386,353 386,331" fill="#B68D1E" />
  <polygon points="406,331 386,353 386,331" fill="#DDB840" />
  <!-- Base golden bar -->
  <rect x="162" y="360" width="295" height="7" fill="#CBA230" />
